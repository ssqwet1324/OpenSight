[package]
edition      = "2024"
name         = "opensight-firmware"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "opensight-firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c3", "unstable"] }


esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c3", "wifi", "esp-alloc", "unstable"] }

esp-rtos = { version = "0.4.0", features = ["esp32c3", "embassy", "esp-radio", "esp-alloc"] }

esp-alloc = { version = "0.11.0", features = ["esp32c3"] }

embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-sync = "0.8.0"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "udp", "tcp"] }
static_cell = "2.1.1"
embedded-websocket = { version = "0.9.5", default-features = false }
rand_core = "0.6.4"
ssd1306 = "0.10.0"
embedded-graphics = "0.8.1"
display-interface-i2c = "0.5.0"

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }

critical-section = "1.2.0"
esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32c3", "jtag-serial", "critical-section"] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
